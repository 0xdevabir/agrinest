name: agrinest

x-backend-env: &backend-env
  APP_NAME: AgriNest
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env (see .env.example)}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://localhost:5173}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: agrinest
  DB_USERNAME: agrinest
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  SESSION_DRIVER: array
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  ATLAS_API_KEY: ${ATLAS_API_KEY:-}
  NOVA_API_KEY: ${NOVA_API_KEY:-}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agrinest
      POSTGRES_USER: agrinest
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - agrinest-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrinest -d agrinest"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - agrinest-uploads:/app/storage/app/public
      - agrinest-tiles:/app/storage/framework/cache/data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  scheduler:
    build: ./backend
    environment: *backend-env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  agrinest-db:
  agrinest-uploads:
  agrinest-tiles:
